name: Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run build
        run: python build.py

      - name: Commit dist
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/lucidui.lua
          if git diff --cached --quiet; then
            echo "No changes to dist/lucidui.lua"
          else
            git commit -m "chore(build): regenerate dist/lucidui.lua [skip ci]"
            git push
          fi
